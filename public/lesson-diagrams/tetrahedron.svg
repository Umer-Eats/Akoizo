<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title"><title id="title">The silicate building block: SiO₄⁴⁻</title><style>text{font-family:Arial,sans-serif;fill:#172940;font-size:19px} .title{font-size:28px;font-weight:bold}.small{font-size:16px}.line{fill:none;stroke:#164873;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}</style><rect width="900" height="560" fill="#f8fafc"/><text class="title" x="30" y="44">The silicate building block: SiO₄⁴⁻</text><path d="M450 115L240 375L680 375ZM450 115L450 440M240 375L450 440L680 375" fill="#deebf5" fill-opacity=".6" stroke="#7693aa" stroke-width="3"/><path d="M450 300L450 115M450 300L240 375M450 300L680 375M450 300L450 440" stroke="#476e8c" stroke-width="9"/><g fill="#d55353" stroke="#7e2424" stroke-width="2"><circle cx="450" cy="115" r="35"/><circle cx="240" cy="375" r="35"/><circle cx="680" cy="375" r="35"/><circle cx="450" cy="440" r="35"/></g><circle cx="450" cy="300" r="30" fill="#e6b34c" stroke="#815c1f" stroke-width="2"/><text x="440" y="307">Si</text><g fill="#fff"><text x="440" y="123">O</text><text x="230" y="383">O</text><text x="670" y="383">O</text><text x="440" y="448">O</text></g><text x="35" y="110">4 oxygen vertices</text><text x="35" y="145">1 silicon center</text><text x="585" y="155">Net charge:</text><text x="585" y="185">(+4) + 4(−2) = −4</text><text x="35" y="495">Corner sharing changes the Si:O ratio; an oxygen shared by two units counts once.</text><text class="small" x="30" y="535">Original teaching schematic · idealized geometry, not a field specimen or measured cross section</text></svg>