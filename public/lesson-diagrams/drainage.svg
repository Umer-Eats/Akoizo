<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title"><title id="title">Drainage patterns suggest geological controls</title><style>text{font-family:Arial,sans-serif;fill:#172940;font-size:19px} .title{font-size:28px;font-weight:bold}.small{font-size:16px}.line{fill:none;stroke:#164873;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}</style><rect width="900" height="560" fill="#f8fafc"/><text class="title" x="30" y="44">Drainage patterns suggest geological controls</text><g fill="#e4edf3"><rect x="35" y="95" width="390" height="160" rx="12"/><rect x="470" y="95" width="390" height="160" rx="12"/><rect x="35" y="305" width="390" height="160" rx="12"/><rect x="470" y="305" width="390" height="160" rx="12"/></g><g class="line"><path d="M90 125L180 180L265 210L380 230M150 120L180 180M230 125L220 195M305 150L265 210M330 230L355 175"/><path d="M510 125H565V165H650V210H815M615 125V165M735 125V210M815 155H780V210"/><path d="M80 335L385 420M125 335L130 349M155 400L170 360M215 335L210 370M260 440L270 390M315 350L300 400M355 450L360 415"/><path d="M665 380L510 325M665 380L535 440M665 380L795 325M665 380L820 440M665 380V320M665 380V445"/></g><text x="45" y="85">Dendritic: relatively uniform substrate</text><text x="480" y="85">Rectangular: joints or fractures</text><text x="45" y="295">Trellis: alternating resistant layers</text><text x="480" y="295">Radial: flow away from a high center</text><text x="35" y="500">Use relief, rock structure and a mapped divide to test the interpretation.</text><text class="small" x="30" y="535">Original teaching schematic · idealized geometry, not a field specimen or measured cross section</text></svg>