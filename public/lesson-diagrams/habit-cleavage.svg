<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="title"><title id="title">Growth habit and breakage geometry differ</title><style>text{font-family:Arial,sans-serif;fill:#172940;font-size:19px} .title{font-size:28px;font-weight:bold}.small{font-size:16px}.line{fill:none;stroke:#164873;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}</style><rect width="900" height="560" fill="#f8fafc"/><text class="title" x="30" y="44">Growth habit and breakage geometry differ</text><text x="80" y="100">Cubic fluorite growth habit</text><polygon points="100,180 235,140 345,210 210,255" fill="#d4c1ef" stroke="#634398" stroke-width="3"/><polygon points="100,180 210,255 210,395 100,320" fill="#b89dda" stroke="#634398" stroke-width="3"/><polygon points="210,255 345,210 345,350 210,395" fill="#936fc2" stroke="#634398" stroke-width="3"/><text x="495" y="100">Octahedral cleavage fragment</text><polygon points="655,145 550,280 655,410 770,280" fill="#c1ddec" stroke="#164873" stroke-width="3"/><path d="M550 280H770M655 145L680 280L655 410M655 145L620 280L655 410" fill="none" stroke="#164873" stroke-width="3"/><path d="M370 275H495M480 260L495 275L480 290" class="line"/><text x="70" y="460">Growth faces reflect the crystal's external development.</text><text x="70" y="492">Four cleavage directions can produce eight faces; opposite faces are parallel.</text><text class="small" x="30" y="535">Original teaching schematic · idealized geometry, not a field specimen or measured cross section</text></svg>