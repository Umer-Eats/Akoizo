<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400"><title>Stream station: section perpendicular to flow</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#183946"/></marker></defs><rect width="720" height="400" fill="white"/><g font-family="Arial,sans-serif" fill="#142d38" stroke="#183946" stroke-width="2"><g stroke="none"><text x="28" y="30" font-size="21" font-weight="bold">Stream station: section perpendicular to flow</text></g><path d="M80 100L160 270L560 270L640 100" fill="none" /><line x1="120" y1="160" x2="600" y2="160" stroke="#006c80" stroke-width="4"/><line x1="160" y1="270" x2="160" y2="160" stroke-dasharray="6 4"/><line x1="560" y1="270" x2="560" y2="160" stroke-dasharray="6 4"/><g stroke="none"><text x="255" y="145" font-size="17" >Width = 9 m</text></g><g stroke="none"><text x="210" y="235" font-size="17" >Mean depth = 2 m</text></g><g stroke="none"><text x="160" y="320" font-size="17" >Rectangular approximation; mean velocity = 0.6 m/s</text></g></g></svg>