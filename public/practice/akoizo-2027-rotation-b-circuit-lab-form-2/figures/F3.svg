<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400"><title>Standard rectangular gate notation</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#183946"/></marker></defs><rect width="720" height="400" fill="white"/><g font-family="Arial,sans-serif" fill="#142d38" stroke="#183946" stroke-width="2"><g stroke="none"><text x="28" y="30" font-size="21" font-weight="bold">Standard rectangular gate notation</text></g><g stroke="none"><text x="35" y="135" font-size="17" >A</text></g><g stroke="none"><text x="35" y="245" font-size="17" >B</text></g><line x1="60" y1="130" x2="200" y2="130" /><line x1="60" y1="240" x2="200" y2="240" /><rect x="200" y="95" width="170" height="190" fill="#fff" /><g stroke="none"><text x="235" y="195" font-size="17" >AND</text></g><circle cx="380" cy="190" r="10" fill="#fff" /><line x1="390" y1="190" x2="475" y2="190" /><path d="M475 145L475 235L550 190Z" fill="none" /><circle cx="560" cy="190" r="10" fill="#fff" /><line x1="570" y1="190" x2="650" y2="190" /><g stroke="none"><text x="610" y="165" font-size="17" >Y</text></g><g stroke="none"><text x="50" y="350" font-size="17" >Output bubbles indicate inversion; no clock or memory elements</text></g></g></svg>