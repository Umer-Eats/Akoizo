<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400"><title>One teaching star: orbital distances are labeled</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#183946"/></marker></defs><rect width="720" height="400" fill="white"/><g font-family="Arial,sans-serif" fill="#142d38" stroke="#183946" stroke-width="2"><g stroke="none"><text x="28" y="30" font-size="21" font-weight="bold">One teaching star: orbital distances are labeled</text></g><circle cx="80" cy="210" r="35" fill="#fff0dc" /><g stroke="none"><text x="60" y="215" font-size="17" >Star</text></g><rect x="290" y="90" width="210" height="240" fill="#e4efdc" /><g stroke="none"><text x="295" y="70" font-size="17" >Model zone:0.8 to1.6 AU</text></g><circle cx="220" cy="210" r="12" fill="#fff" /><g stroke="none"><text x="165" y="265" font-size="17" >A:0.5 AU</text></g><circle cx="400" cy="210" r="12" fill="#fff" /><g stroke="none"><text x="345" y="265" font-size="17" >B:1.0 AU</text></g><circle cx="620" cy="210" r="12" fill="#fff" /><g stroke="none"><text x="570" y="265" font-size="17" >C:2.0 AU</text></g><g stroke="none"><text x="50" y="375" font-size="17" >Schematic only; all worlds orbit the same star.</text></g></g></svg>